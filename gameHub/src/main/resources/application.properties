server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/game}
spring.data.mongodb.auto-index-creation=true

spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}

# Valore di default valido solo per il container Neo4j locale di sviluppo (mongo_local/neo4j_local,
# vedi CLAUDE.md); in produzione va sempre passata via variabile d'ambiente NEO4J_PASSWORD.
spring.neo4j.authentication.password=${NEO4J_PASSWORD:elliejoel}

# Redis: cache dei suggerimenti amici/giochi della Home (vedi UserNeo4jService / GameNeo4jService).
# Database 5 dedicato per non collidere con altri usi locali dell'istanza Redis condivisa.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.database=${REDIS_DATABASE:5}

# JWT: la chiave HS256 richiede almeno 256 bit. In produzione va passata via variabile d'ambiente.
gamehub.jwt.secret=${GAMEHUB_JWT_SECRET:0f3b8c2d7a41e59f6b0d8e2c4a7f1b93d5e6c8a0f2b4d6e8a1c3f5b7d9e0a2c4}
gamehub.jwt.expiration-ms=86400000

# Origini CORS ammesse (comma-separated). In produzione va impostata al dominio Vercel del frontend.
gamehub.cors.allowed-origins=${GAMEHUB_CORS_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

