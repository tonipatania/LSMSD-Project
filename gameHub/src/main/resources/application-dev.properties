# Profilo "dev": attivo di default in locale (vedi spring.profiles.default in
# application.properties) quando SPRING_PROFILES_ACTIVE non e' impostata. Fornisce i valori di
# sviluppo per le proprieta' che in application.properties non hanno piu' un default, cosi' che
# ./mvnw spring-boot:run funzioni subito con mongo_local/neo4j_local (vedi CLAUDE.md, docker-
# compose.yml) senza dover esportare variabili d'ambiente a mano.
#
# NON e' mai attivo in produzione: SPRING_PROFILES_ACTIVE=prod (impostata su Render, vedi
# render.yaml) sostituisce del tutto spring.profiles.default, quindi questo file viene ignorato e
# le proprieta' sotto restano i soli placeholder senza default definiti in application.properties.

# Password del container Neo4j locale di sviluppo (mongo_local/neo4j_local, vedi CLAUDE.md /
# docker-compose.yml). Puo' restare qui perche' il container non e' mai raggiungibile da fuori
# localhost.
spring.neo4j.authentication.password=elliejoel

# Chiave HS256 di sviluppo (256 bit, generata una tantum): firma solo i token emessi in locale,
# non e' mai usata in produzione (vedi nota sopra).
gamehub.jwt.secret=0f3b8c2d7a41e59f6b0d8e2c4a7f1b93d5e6c8a0f2b4d6e8a1c3f5b7d9e0a2c4
