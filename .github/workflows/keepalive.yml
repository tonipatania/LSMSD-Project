name: Keep Aura/Render alive

on:
  schedule:
    - cron: '0 8 * * *'  # ogni giorno alle 8:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint (query reale su Neo4j Aura)
        run: |
          url="https://gamehub-kidi.onrender.com/actuator/health"
          # --retry per sopravvivere al cold start di Render (decine di secondi)
          response=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            "$url")
          echo "HTTP status: $response"
          cat /tmp/health.json
          echo
          if [ "$response" != "200" ]; then
            echo "::error::Health check failed with HTTP $response"
            exit 1
          fi
