name: CI Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: gameHub

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # setup-java's `cache: maven` only covers ~/.m2/repository: without this the wrapper
      # re-downloads the Maven distribution from Central on every job, and a transient failure
      # there (404/5xx) fails the build before any project code runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('gameHub/.mvn/wrapper/maven-wrapper.properties') }}
      - run: ./mvnw -B spotless:check checkstyle:check

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/elliejoel
        ports: ['7474:7474', '7687:7687']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # setup-java's `cache: maven` only covers ~/.m2/repository: without this the wrapper
      # re-downloads the Maven distribution from Central on every job, and a transient failure
      # there (404/5xx) fails the build before any project code runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('gameHub/.mvn/wrapper/maven-wrapper.properties') }}
      - run: ./mvnw -B test

  integration-e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/elliejoel
        ports: ['7474:7474', '7687:7687']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # setup-java's `cache: maven` only covers ~/.m2/repository: without this the wrapper
      # re-downloads the Maven distribution from Central on every job, and a transient failure
      # there (404/5xx) fails the build before any project code runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('gameHub/.mvn/wrapper/maven-wrapper.properties') }}
      - run: ./mvnw -B verify

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gamehub-backend:ci .
